[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crcv"
version = "5.21.0.dev2"
description = "CRCV compact dual-action corrective refinement with real-data training and Q1 evidence tooling"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "scikit-learn",
  "opencv-python-headless",
  "lightgbm",
]

[project.optional-dependencies]
test = ["pytest>=8"]
legacy = ["torch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["crcv_core*", "crcv_q1*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
