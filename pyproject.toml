[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crcv"
version = "5.20.3"
description = "CRCV corrective crack-segmentation refinement and publication evidence tooling"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "scikit-learn",
  "opencv-python-headless",
  "torch",
  "lightgbm",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["crcv52*", "crcv_q1*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
