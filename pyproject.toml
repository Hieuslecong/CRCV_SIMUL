[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crcv52"
version = "5.5.0"
description = "CRCV V5.5 simulation-informed same-crack relational correction research prototype"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "scikit-learn",
  "opencv-python-headless",
  "torch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crcv52*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
